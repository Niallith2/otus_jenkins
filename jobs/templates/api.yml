- job-template:
    name: 'api'
    description: 'API тесты'
    project-type: pipeline
    parameters:
      - string:
          name: BRANCH
          default: master
          description: Branch
      - string:
          name: URL
          default: https://fakerestapi.azurewebsites.net
          description: API Url
      - bool:
          name: FORCE
          default: false
          description: Принудительно пересобрать образ, игнорируя кэш
    pipeline-scm:
      scm:
        - api
      script-path: Jenkinsfile